name: Build Potinium
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", java: "21" }
          - { mc: "26.1.2", java: "25" }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q -o neon-lyrics-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        run: bash neon-lyrics/ci/build.sh ${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: Potinium-${{ matrix.mc }}
          path: neon-lyrics/mc-${{ matrix.mc }}/build/libs/*.jar
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: potinium-mc${{ matrix.mc }}-run${{ github.run_number }}
          name: Potinium for Minecraft ${{ matrix.mc }}
          files: neon-lyrics/mc-${{ matrix.mc }}/build/libs/*.jar
          
